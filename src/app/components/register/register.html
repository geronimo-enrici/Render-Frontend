<div class="auth-wrapper">
  <div class="auth-card">
    
    <h2>Crear Cuenta</h2>
    
    <form [formGroup]="registerForm" (ngSubmit)="registrar()">
      
      <div class="input-row">
        <div class="input-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" formControlName="nombre" placeholder="Tu nombre">
        </div>
        
        <div class="input-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" formControlName="apellido" placeholder="Tu apellido">
        </div>
      </div>

      <div class="input-group">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" formControlName="telefono" placeholder="+54 11 1234-5678">
      </div>

      <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" placeholder="ejemplo@correo.com">
      </div>

      <div class="input-group">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" formControlName="contrasena" placeholder="Mínimo 6 caracteres">
      </div>

      <button type="submit" class="btn-submit" [disabled]="registerForm.invalid">REGISTRARSE</button>
      
    </form>
    
    <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Ingresa aquí</a></p>
  </div>
</div>
